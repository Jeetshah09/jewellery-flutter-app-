services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurelia
      POSTGRES_USER: aurelia
      POSTGRES_PASSWORD: aurelia-dev-password
    volumes:
      - aurelia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia -d aurelia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aurelia:aurelia-dev-password@db:5432/aurelia
      JWT_SECRET: local-compose-secret-change-before-production
      ADMIN_EMAIL: admin@aurelia.test
      ADMIN_PASSWORD: change-this-password
      PAYMENT_MODE: demo
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  aurelia-postgres:
